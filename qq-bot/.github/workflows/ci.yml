name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 代码检查
        run: |
          ruff check .
          ruff format --check .

      - name: 单元测试
        run: pytest -q

      - name: 启动冒烟测试
        env:
          ENVIRONMENT: dev
        run: |
          cp .env.example .env.dev
          timeout 15 python bot.py > boot.log 2>&1 || true
          cat boot.log
          grep -q "Running NoneBot" boot.log
